# vla_libero Stage 1a recipe (DYNAMIC_SCENES_VLA_PLAN_20261108 Stage 1): StarVLA QwenOFT (OFT-style MLP L1 regression head
# on 8 action-query tokens) on LIBERO-Spatial. Identical for every arm; per arm only framework.qwenvl.base_vlm changes
# (B0 = Qwen3.5-B0 base, B1 = Qwen3.5-B1 student). Launch scripts override paths, run_id, data_mix and seed.
run_id: vll
run_root_dir: ./runs
seed: 0
wandb_entity: none
wandb_project: none
is_debug: false
version_id: "0.21"

framework:
  name: QwenOFT
  qwenvl:
    base_vlm: ./models/Qwen3.5-B0
    attn_implementation: flash_attention_2
    vl_hidden_dim: 4096
  action_model:
    action_model_type: MLP
    action_dim: 7
    state_dim: 7
    action_horizon: 8

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    data_root_dir: ./data/lerobot
    data_mix: pilot_libero_spatial_d5_s0
    action_type: delta_qpos
    sequential_step_sampling: false
    obs_image_size: [224, 224]
    per_device_batch_size: 16          # x 4 GPUs = global batch 64
    load_all_data_for_training: true
    video_backend: torchvision_av
    num_workers: 8
    include_state: false               # recipe choice, same for every arm (see PRELAUNCH_CARD.md)

trainer:
  max_train_steps: 10000
  num_warmup_steps: 300              # 3%
  save_steps: [1000, 2000, 5000, 10000]
  state_steps: [2000, 5000, 8000]
  save_interval: 1                   # vl_train.py filters on save_steps / state_steps
  eval_interval: 100000000
  learning_rate:
    base: 3.0e-05
    qwen_vl_interface: 3.0e-05
    action_model: 3.0e-04            # head at 10x
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  freeze_modules: qwen_vl_interface.model.model.visual   # ViT + merger frozen, as in the student's training (train.vision_blocks=false, merger=false)
  loss_scale:
    vla: 1.0
    vlm: 0.0
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 10
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  gradient_checkpointing: false     # applied to the VLM by vl_train.py (StarVLA's Qwen3.5 wrapper ignores it)
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
