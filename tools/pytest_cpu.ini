[pytest]
# Read only by tools/test_cpu.sh through -c; plain pytest never finds a file with this name.
# cpu_skip: paths whose tests read /home or /data* (or need a package the CPU env lacks), with the reason.
cpu_skip =
    tools/tests/test_numeric_tolerance_tiers.py :: imports /home/jjyeung/agent_project_distill/collector/census.py by absolute path
    student/compact_targets :: git rev-parse on a /data2 checkout; /home and /data2 fixture paths
    student/landing :: runs /home/jjyeung/agent_project/agent/scripts/cohort_guard.py from the main repository
    student/eval-harness :: runs cohort_guard.py from the main repository; HF cache on /data2
    student/shakedown :: HF cache path on /data2
    materialize :: reads PLAN.json and CONTRACT.json from /data2
    collector :: imports google.genai and cv2, missing from the CPU env (requirements-cpu.txt)
    gt_adapters :: imports collector modules by sibling path; needs google.genai and cv2
    preparers :: imports google.genai and cv2, missing from the CPU env (requirements-cpu.txt)
    tools/gtmeasure :: imports shapely, missing from the CPU env (requirements-cpu.txt)
